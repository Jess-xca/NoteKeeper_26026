services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: notekeeper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - notekeeper_pg:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - notekeeper_mongo:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  backend:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mongo
      - rabbitmq

  frontend:
    build: ../NoteKeeper_Frontend_26026
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  notekeeper_pg:
  notekeeper_mongo:
