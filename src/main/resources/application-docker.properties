spring.datasource.url=jdbc:postgresql://postgres:5432/notekeeper
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.data.mongodb.uri=mongodb://mongo:27017/notekeeper
spring.data.mongodb.database=notekeeper

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672

jwt.secret=${JWT_SECRET:assignment-demo-secret-key-must-be-long}
google.client.id=${GOOGLE_CLIENT_ID:local-demo}
